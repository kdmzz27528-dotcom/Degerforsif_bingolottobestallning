<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beställning – Degerfors IF P-18</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f2f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#202020}
.wrap{max-width:760px;margin:0 auto;background:#fff;min-height:100vh}
header{background:#c8101e;color:#fff;text-align:center;padding:28px 18px}
header h1{margin:0;font-size:32px} header p{margin:12px 0 0;font-size:21px}
main{padding:30px}
label{display:block;font-size:22px;font-weight:700;margin:0 0 10px}
input[type=text],input[type=tel]{width:100%;height:64px;border:1px solid #bbb;border-radius:12px;padding:0 18px;font-size:20px;margin-bottom:27px}
h2{font-size:27px;margin:12px 0 20px}
.product{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 0;border-bottom:1px solid #e5e5e5}
.name{font-size:21px;font-weight:700;margin-bottom:5px}.price{font-size:18px;color:#666}
select{width:120px;height:62px;border:1px solid #bbb;border-radius:12px;background:#fff;font-size:20px;padding:0 12px}
.total{margin-top:28px;background:#fff0a8;border-radius:14px;padding:22px;display:flex;justify-content:space-between;font-size:23px;font-weight:800}
button{width:100%;margin-top:24px;padding:20px;border:0;border-radius:12px;background:#c8101e;color:#fff;font-size:22px;font-weight:800;cursor:pointer}
button:disabled{opacity:.6}.status{display:none;margin-top:22px;padding:22px;border-radius:12px;text-align:center;font-size:22px;font-weight:700}
.success{background:#e7f6e7;color:#176b27}.error{background:#fdeaea;color:#9d1111}.fine{font-size:13px;color:#777;text-align:center;margin-top:16px}
@media(max-width:600px){main{padding:24px 20px}header h1{font-size:27px}header p{font-size:18px}.name{font-size:19px}select{width:100px}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Beställning – Degerfors IF P-18</h1><p>Bingolotter och julkalendrar</p></header>
<main>
<form id="orderForm" action="https://formsubmit.co/elinanderssons@hotmail.com" method="POST">
<input type="hidden" name="_subject" value="Ny beställning – Degerfors IF P-18">
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_template" value="table">
<input type="hidden" id="emailTotal" name="Totalsumma" value="0 kr">

<label for="name">Namn</label>
<input id="name" name="Namn" type="text" placeholder="Fyll i ditt namn" required>
<label for="phone">Telefonnummer</label>
<input id="phone" name="Telefonnummer" type="tel" placeholder="Fyll i telefonnummer" required>

<h2>Välj antal</h2>
<div id="products"></div>

<div class="total"><span>Totalt</span><span id="total">0 kr</span></div>
<button id="submitButton" type="submit">BESTÄLL</button>
<div id="success" class="status success">✓ Tack för din beställning!</div>
<div id="error" class="status error">Beställningen kunde inte skickas. Försök igen.</div>
<div class="fine">Din beställning skickas till Degerfors IF P-18.</div>
</form>
</main>
</div>

<script>
const products=[
["Bingolottos julkalender",100],["Enkellott",100],["Dubbellott",200],
["Trippellott",300],["Nyår enkellott",100],["Nyår dubbellott",200],["Nyår trippellott",300]
];
const holder=document.getElementById("products");
products.forEach(([name,price])=>{
 const row=document.createElement("div"); row.className="product";
 const info=document.createElement("div"); info.innerHTML=`<div class="name">${name}</div><div class="price">${price} kr/st</div>`;
 const sel=document.createElement("select"); sel.name=name; sel.className="quantity"; sel.dataset.price=price;
 for(let i=0;i<=20;i++){const o=document.createElement("option");o.value=i;o.textContent=i;sel.appendChild(o)}
 row.append(info,sel);holder.appendChild(row);
});
const qs=[...document.querySelectorAll(".quantity")], total=document.getElementById("total"), emailTotal=document.getElementById("emailTotal");
function calc(){let t=0;qs.forEach(s=>t+=(+s.value)*(+s.dataset.price));const txt=t.toLocaleString("sv-SE")+" kr";total.textContent=txt;emailTotal.value=txt;return t}
qs.forEach(s=>s.addEventListener("change",calc)); calc();

document.getElementById("orderForm").addEventListener("submit",async e=>{
 e.preventDefault();
 if(!qs.some(s=>+s.value>0)){alert("Välj minst en lott eller kalender innan du beställer.");return}
 const form=e.currentTarget, btn=document.getElementById("submitButton"), ok=document.getElementById("success"), err=document.getElementById("error");
 calc(); btn.disabled=true;btn.textContent="SKICKAR...";ok.style.display=err.style.display="none";
 try{
   const res=await fetch(form.action,{method:"POST",body:new FormData(form),headers:{Accept:"application/json"}});
   if(!res.ok) throw new Error();
   ok.style.display="block";btn.style.display="none";
   ok.scrollIntoView({behavior:"smooth",block:"center"});
 }catch(x){
   err.style.display="block";btn.disabled=false;btn.textContent="BESTÄLL";
 }
});
</script>
</body>
</html>
